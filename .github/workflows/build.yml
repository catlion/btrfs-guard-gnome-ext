name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext libglib2.0-bin unzip

      - name: Build extension archive
        run: make zip

      - name: Check archive contents
        run: |
          unzip -l out/*.shell-extension.zip
          unzip -l out/*.shell-extension.zip | grep -q ' icon.png$'

      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension
          path: out/*.shell-extension.zip
          if-no-files-found: error

      - name: Attach archive to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.shell-extension.zip
